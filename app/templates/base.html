      FIRST VIEWPORT: Compact navigation frames written safety state and the page-specific evidence workbench.
      FORM: Divider-led lifecycle and settings workbenches inside the Plex-adjacent direction B world, seed c0c31952.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
