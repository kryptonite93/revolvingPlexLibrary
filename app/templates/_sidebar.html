<aside class="sidebar">
  <a class="brand-lockup" href="/dashboard" aria-label="{{ app_name }} dashboard">
    <span class="brand-mark compact" aria-hidden="true"><span></span><span></span><span></span></span>
    <span>Revolving<br>Plex Manager</span>
  </a>
  <nav aria-label="Primary navigation">
    <a href="/dashboard" {% if active_page == "dashboard" %}aria-current="page"{% endif %}>Overview</a>
    <a href="/media" {% if active_page == "media" %}aria-current="page"{% endif %}>Media</a>
    <span aria-disabled="true">Deletion queue</span>
    <span aria-disabled="true">Audit log</span>
    <a href="/settings" {% if active_page == "settings" %}aria-current="page"{% endif %}>Settings</a>
  </nav>
  <form method="post" action="/logout">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <button class="button button-quiet" type="submit">Sign out {{ admin.username }}</button>
  </form>
</aside>
